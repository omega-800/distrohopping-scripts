font_family JetBrainsMono Nerd Font Mono
font_size 10

shell_integration no-rc no-sudo no-cursor

auto_reload_config -1
background_opacity 0.85
confirm_os_window_close 0
cursor_blink_interval 1
cursor_shape block
cursor_shape_unfocused hollow
cursor_stop_blinking_after 60
cursor_trail 1
enable_audio_bell no
scrollback_lines 10000
sync_to_monitor no
update_check_interval 0

map ctrl+f>= set_font_size 10
map ctrl+f>ctrl+d change_font_size all -5.0
map ctrl+f>ctrl+i change_font_size all +5.0
map ctrl+f>d change_font_size all -1.0
map ctrl+f>i change_font_size all +1.0

background #1e1e2e
foreground #cdd6f4
selection_background #45475a
selection_foreground #cdd6f4

cursor #cdd6f4
cursor_text_color #1e1e2e

url_color #585b70

active_border_color #45475a
inactive_border_color #181825

wayland_titlebar_color #1e1e2e
macos_titlebar_color #1e1e2e

active_tab_background #1e1e2e
active_tab_foreground #cdd6f4
inactive_tab_background #181825
inactive_tab_foreground #585b70
tab_bar_background #181825

color0 #1e1e2e
color1 #f38ba8
