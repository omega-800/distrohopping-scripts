# bind o run "/nix/store/plj3ipmgbqc9cbnvfs1d42b7qpl6qq4b-open-github-project"

bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '/home/omega/.local/share/tmux/plugins'
# needed for yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set-option -ga terminal-overrides ",xterm-256color:Tc"

bind N split-window -h -l 3 -b "printf '\e[7;49;36m\e[0;40;36m' && echo {200..0} | tr ' ' '\n' && read" \; select-pane -l
# Default statusbar color
set-option -g status-style bg="#181825",fg="#f2cdcd"

# Default window title colors
set-window-option -g window-status-style bg="#f5e0dc",fg="#181825"

# Default window with an activity alert
set-window-option -g window-status-activity-style bg="#181825",fg="#89b4fa"

# Active window title colors
set-window-option -g window-status-current-style bg="#313244",fg="#181825"

# Set active pane border color
set-option -g pane-active-border-style fg="#cba6f7"

# Set inactive pane border color
set-option -g pane-border-style fg="#585b70"

# Message info
set-option -g message-style bg="#181825",fg="#a6e3a1"

# Writing commands inactive
set-option -g message-command-style bg="#181825",fg="#b4befe"

# Pane number display
set-option -g display-panes-active-colour "#cdd6f4"
set-option -g display-panes-colour "#181825"

# Clock
set-window-option -g clock-mode-colour "#45475a"

# Bell
set-window-option -g window-status-bell-style bg="#f38ba8",fg="#181825"

