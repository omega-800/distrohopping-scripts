#source-file /nix/store/n27aza00anhlbinbq1qsi9ianmpcn2qm-base16-untitled.conf

unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix
set -g status-interval 5

set-window-option -g automatic-rename on
set-option -g set-titles on
set -g base-index 1
setw -g pane-base-index 1
set-option -g history-limit 5000
set-option -sg escape-time 10
set-option -g default-terminal "screen-256color"

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

bind M setw mouse
bind W set-window-option synchronize-panes

bind-key / copy-mode \; send-key ?

unbind '"'
unbind %
bind ä split-window -hc "#{pane_current_path}"
bind ö split-window -vc "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind H swap-pane -s '{left-of}'
bind J swap-pane -s '{down-of}'
bind K swap-pane -s '{up-of}'
bind L swap-pane -s '{right-of}'

unbind p
bind p previous-window
bind n next-window

bind -r C-h resize-pane -L 10
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 10

bind a choose-window 'join-pane -h -s "%%"'
bind A choose-window 'join-pane -s "%%"'

bind g last-window

bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1

bind S command-prompt -p "New Session:" "new-session -A -s '%%'"
bind Q confirm kill-session

set-window-option -g mode-keys vi
set -g status-keys vi
set-option -g status-position top

unbind-key -T copy-mode-vi v
bind v copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X clear-selection
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind-key -T copy-mode-vi Y send -X copy-selection

bind -T copy-mode-vi i send -X cancel             

bind -T copy-mode-vi 0 send -X start-of-line      
bind -T copy-mode-vi $ send -X end-of-line        
bind -T copy-mode-vi w send -X next-word          
bind -T copy-mode-vi b send -X previous-word      
bind -T copy-mode-vi e send -X next-word-end      
bind -T copy-mode-vi / send -X search-forward     
bind -T copy-mode-vi n send -X search-again       
bind -T copy-mode-vi N send -X search-reverse     
bind -T copy-mode-vi G send -X history-bottom     
bind -T copy-mode-vi g send -X history-top        

bind N split-window -h -l 3 -b "printf '\e[38;5;0m\e[48;5;226m' && seq 200 1 && echo -n 0 && read" \; select-pane -l

bind b list-buffers     # list paste buffers
# bind p paste-buffer -p  # paste from the top paste buffer
bind P choose-buffer    # choose which buffer to paste from

